name: EvidenceSearch • Source & fixture checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-safety:
    name: Public-file audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Audit all tracked paths and source content
        run: python scripts/audit_public_release.py
      - name: Unit-test publication guardrails
        run: python -m unittest discover -s scripts/release_tests -v

  backend-fixtures:
    name: Backend API / retrieval fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements_ci.txt
      - run: python -m compileall -q backend
      - run: python -m pytest backend/tests -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
